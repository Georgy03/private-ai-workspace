[package]
name = "private-ai-connector-workspace"
default-run = "private-ai-connector-workspace"
version = "0.1.0"
description = "A cited AI workspace with a local index"
authors = ["Private AI Connector Workspace"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "private_ai_connector_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "private-ai-connector-workspace"
path = "src/main.rs"

[[bin]]
name = "workspace-parser"
path = "src/bin/workspace-parser.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-config = "1.13"
aws-credential-types = "1.3"
aws-sigv4 = "1.6"
base64 = "0.22"
calamine = { version = "0.37", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
dirs = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
notify = "8.2"
pdf-extract = "0.12.1"
quick-xml = "0.38"
rand = "0.9"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "chrono", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.4"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
walkdir = "2.5"
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
